name: Quota Windows

on:
  workflow_dispatch:
  push:
    branches: [quota-panel]
    paths:
      - "src/apps/quota/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/quota-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-hud/quota typecheck
      - run: pnpm --filter @agent-hud/quota test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src/apps/quota/src-tauri/Cargo.toml -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - run: cargo metadata --manifest-path src/apps/quota/src-tauri/Cargo.toml --locked --no-deps --format-version 1
      - run: pnpm --filter @agent-hud/quota tauri build
      - name: Verify updater install into existing portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'Agent HUD portable update test'
          New-Item -ItemType Directory -Path $directory | Out-Null
          # These external launcher/config files must survive an in-place update.
          'launcher-preservation-sentinel' | Set-Content -LiteralPath (Join-Path $directory 'Run-LocalPanel.ps1')
          'connection-preservation-sentinel' | Set-Content -LiteralPath (Join-Path $directory 'connection-test.txt')
          Copy-Item -LiteralPath target/release/agent-hud-quota.exe -Destination (Join-Path $directory 'agent-hud-quota.exe')
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          # /D must remain the last unquoted argument, including spaces in the path.
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /UPDATE /D=$directory" -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(120000)) { throw 'Updater installer timed out' }
          if ($process.ExitCode -ne 0) { throw "Updater installer failed: $($process.ExitCode)" }
          node src/apps/quota/scripts/verify-installed.mjs target/release/agent-hud-quota.exe (Join-Path $directory 'agent-hud-quota.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Updater did not install the expected executable at the requested path' }
          if ((Get-Content -LiteralPath (Join-Path $directory 'Run-LocalPanel.ps1')).Trim() -ne 'launcher-preservation-sentinel') { throw 'Launcher was changed' }
          if ((Get-Content -LiteralPath (Join-Path $directory 'connection-test.txt')).Trim() -ne 'connection-preservation-sentinel') { throw 'Existing configuration was changed' }
          Write-Output 'PASS: native NSIS updater, path with spaces, in-place executable, external launcher/config preservation.'
      - name: Prepare test bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory quota-artifact | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe quota-artifact/
          Copy-Item target/release/agent-hud-quota.exe quota-artifact/
          Copy-Item src/apps/quota/scripts/Start-Local*.ps1 quota-artifact/
          Copy-Item src/apps/quota/scripts/Install-LocalStartup.ps1 quota-artifact/
          Copy-Item docs/quota-panel.md quota-artifact/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: agent-hud-quota-windows-test-build
          path: quota-artifact/
          if-no-files-found: error
