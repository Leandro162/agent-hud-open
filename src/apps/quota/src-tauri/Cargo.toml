[package]
name = "agent-hud-quota"
version = "0.2.1"
description = "Personal Codex and DeepSeek quota display"
edition = "2021"
license = "Apache-2.0"
publish = false

# Isolated from the upstream runtime and its session/hook dependencies.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tauri-plugin-updater = "=2.14.0"
